[package]
name = "nxapi"
version = "0.2.0"
edition = "2024"
description = "Typed Cisco NX-API enforcement SDK for OSS services"
license = "Apache-2.0"
readme = "README.md"
publish = ["crates-io"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
